name: NUSA ANTARA Belajar

on:
  schedule:
    - cron: "*/30 * * * *"   # setiap 30 menit
  workflow_dispatch:          # bisa dipicu manual dari tab Actions

permissions:
  contents: write

jobs:
  belajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan satu siklus belajar
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python learn.py

      - name: Simpan pengetahuan baru ke repo
        run: |
          git config user.name "nusa-antara-bot"
          git config user.email "nusa-antara-bot@users.noreply.github.com"
          git add nusa_antara/pengetahuan.json
          git diff --cached --quiet || git commit -m "🧠 Belajar: tambah pengetahuan baru [skip ci]"
          git push
