name: CI NUSA ANTARA

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal dependensi
        run: pip install -r requirements.txt

      - name: Jalankan tes
        run: pytest -v

      - name: Uji coba jalankan NUSA ANTARA
        run: python main.py --once "halo, siapa kamu"
